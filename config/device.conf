# CyberFlasher device config — Tecno Spark Go 2023, BF7 variant (not BF7n)
# Values confirmed from device tree analysis + MIO-KITCHEN stock boot.img parse.

DEVICE_CODENAME=bf7
BOARD_NAME=CY-BF7-H6127
SOC=MT6761

# recovery/boot partition is the ~32MB-class budget that's been the whole
# problem (33,554,432 byte hard limit, confirmed via avbtool add_hash_footer
# failures in CI). 64/128 are offered for devices/partitions with more room.
PARTITION_SIZE_PRESETS=33554432,67108864,134217728
PARTITION_SIZE_LABELS=32MB,64MB,128MB

PATH_BOOT=/dev/block/bootdevice/by-name/boot
PATH_RECOVERY=/dev/block/bootdevice/by-name/recovery
PATH_SYSTEM=/dev/block/mapper/system
PATH_VENDOR=/dev/block/mapper/vendor
PATH_PRODUCT=/dev/block/mapper/product
PATH_SYSTEM_EXT=/dev/block/mapper/system_ext

USES_DYNAMIC_PARTITIONS=true
DYNAMIC_PARTITION_GROUP=main
BOARD_MAIN_SIZE=9122611200
BOARD_SUPER_PARTITION_SIZE=9126805504

# Confirmed via /proc/config.gz: kernel only has CONFIG_RD_GZIP=y.
# Do NOT set lzma/lz4/xz here for this device — it bootloops (already tested).
RAMDISK_COMPRESSION=gzip

# Boot image header layout (from parse_bootimg.py / BoardConfig.mk)
BOOT_HEADER_VERSION=2
BOOT_PAGESIZE=2048
BOOT_KERNEL_BASE=0x40078000
BOOT_KERNEL_OFFSET=0x00008000
BOOT_RAMDISK_OFFSET=0x11a88000
BOOT_TAGS_OFFSET=0x07808000
BOOT_DTB_OFFSET=0x07808000

# MTK images wrap the real FDT in a 64-byte proprietary header before the
# actual dtb/dtbo payload — flash_engine's MTK backend must slice
# data[64:64+real_size] before handing anything to dtc.
MTK_DTB_HEADER_SIZE=64

# Stock reference sizes (MIO-KITCHEN parse of stock boot.img), used as a
# sanity baseline when judging how much a custom build has bloated by.
STOCK_KERNEL_SIZE=11883603
STOCK_RAMDISK_SIZE=13413567
STOCK_DTB_SIZE=121231
